<!-- templates/login.html -->
{% extends "auth_base.html" %}

{% block title %}Login | Kenya Timber Trace{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo/Brand -->
    <div class="login-brand">
      <i class="bi bi-tree-fill"></i>
      <span>Kenya Timber Trace</span>
    </div>
    
    <div class="login-subtitle">
      <i class="bi bi-shield-check"></i> Sustainable Forestry Management
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="login-form" method="POST" action="{{ url_for('users.login') }}">
      <div class="form-group">
        <label for="email">
          <i class="bi bi-envelope"></i> Email Address
        </label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">
          <i class="bi bi-lock"></i> Password
        </label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="remember" name="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary login-btn">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
      <div id="msg" class="mt-2 text-danger" role="alert"></div>
    </form>

    <div class="login-footer">
      <div class="login-divider">
        <span>or</span>
      </div>
      <div class="social-login">
        <button class="btn btn-outline-secondary">
          <i class="bi bi-google"></i> Google
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
  /* Additional login-specific styles if needed */
</style>
{% endblock %}

{% block extra_js %}
<script>
  // Toggle password visibility
  document.getElementById('togglePassword')?.addEventListener('click', function() {
    const passwordInput = document.getElementById('password');
    const icon = this.querySelector('i');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    } else {
      passwordInput.type = 'password';
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    }
  });
</script>
{% endblock %}
