{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h2 class="mb-3">Users</h2>
<div id="usersMsg" class="mb-2 small text-danger"></div>
<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#userModal">Add User</button>
<table class="table table-striped">
  <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th></tr></thead>
  <tbody id="usersBody"></tbody>
</table>

<!-- Simple Add User Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Add User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="addUserForm">
          <input name="name" class="form-control mb-2" placeholder="Name" required>
          <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
          <input name="password" type="password" class="form-control mb-2" placeholder="Password" required>
          <select name="role" class="form-select mb-2" required>
            <option value="logger">Logger</option>
            <option value="transporter">Transporter</option>
            <option value="mill">Mill</option>
            <option value="inspector">Inspector</option>
            <option value="buyer">Buyer</option>
            <option value="admin">Admin</option>
          </select>
          <input name="phone" class="form-control mb-2" placeholder="Phone">
          <button class="btn btn-success">Create</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
